TEXT_MENU_OPENSPY_PATCH=Parche de OpenSpy
TEXT_MENU_OPENSPY_DESCRIPTION=1. Cierra sesión en PSN primero.\n2. Inicia el juego y espera a que aparezca la pantalla de título\no el menú.\n3. Abre el XMB y luego qDNSm.\n4. Espera a que los iconos del XMB en segundo plano\nterminen de cargarse.\n5. El LED amarillo del HDD en la parte frontal de la consola\ndebería dejar de parpadear.\n6. Cuando los iconos se hayan cargado y el HDD esté inactivo,\nselecciona Parche de OpenSpy.\n7. Espera a que aparezca la notificación de confirmación.\n8. Sal del XMB y conéctate online en el juego y en PSN.
TEXT_MENU_OPENSPY_HINT=Inicia el juego sin haber iniciado sesión en PSN y espera a que se carguen los iconos del XMB. Pasos completos: Instrucciones > Parche de OpenSpy.
