TEXT_MENU_HIGH_MEMORY_TITLE=Advertencia de uso elevado de memoria
TEXT_MENU_HIGH_MEMORY_DESCRIPTION=Un signo de exclamación amarillo junto a la llama\nadvierte de un uso elevado de la memoria VSH.\nEsto puede ocurrir con webMAN Mod Full\no con demasiados plugins en boot_plugins.txt.\n\nFijo: uso elevado de la memoria VSH.\nIntermitente: la memoria VSH está en niveles peligrosos.\n\nSi no necesitas las funciones adicionales de webMAN Mod,\nutiliza webMAN Mod Lite.\nElimina los plugins que no necesites.\nEsto es especialmente recomendable si los juegos se bloquean\no la consola vuelve al menú de recuperación al iniciar un juego.
