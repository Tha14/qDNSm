TEXT_MENU_OPENSPY_PATCH=Patch OpenSpy
TEXT_MENU_OPENSPY_DESCRIPTION=1. Saia da PSN primeiro.\n2. Inicie o jogo e aguarde até que a tela de título ou o menu apareça.\n3. Abra o XMB e depois o qDNSm.\n4. Aguarde até que os ícones do XMB em segundo plano\nterminem de carregar.\n5. O LED amarelo do HDD na parte frontal do console\ndeve parar de piscar.\n6. Quando os ícones estiverem carregados e o HDD estiver inativo,\nselecione Patch OpenSpy.\n7. Aguarde a notificação de confirmação.\n8. Saia do XMB e conecte-se online no jogo e na PSN.
TEXT_MENU_OPENSPY_HINT=Inicie o jogo sem estar conectado à PSN e aguarde o carregamento dos ícones do XMB. Instruções completas: Instruções > Patch OpenSpy.
