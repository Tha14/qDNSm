TEXT_MENU_HIGH_MEMORY=Aviso de memória
TEXT_MENU_HIGH_MEMORY_TITLE=Aviso de uso elevado de memória
TEXT_MENU_HIGH_MEMORY_DESCRIPTION=Um ponto de exclamação amarelo ao lado da chama\nalerta sobre o uso elevado da memória VSH.\nIsso pode ocorrer com o webMAN Mod Full\nou com muitos plugins no arquivo boot_plugins.txt.\n\nAceso continuamente: uso elevado da memória VSH.\nPiscando: a memória VSH atingiu um nível perigoso.\n\nSe não precisar dos recursos extras do webMAN Mod,\nuse o webMAN Mod Lite.\nRemova os plugins desnecessários.\nIsso é especialmente recomendado se os jogos travarem\nou se o console voltar ao menu de recuperação ao iniciar um jogo.
