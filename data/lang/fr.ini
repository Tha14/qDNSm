TEXT_MENU_OPENSPY_PATCH=Patch OpenSpy
TEXT_MENU_OPENSPY_DESCRIPTION=1. Déconnecte-toi d'abord du PSN.\n2. Lance le jeu et attends que l'écran titre ou le menu apparaisse.\n3. Ouvre le XMB, puis qDNSm.\n4. Attends que les icônes du XMB en arrière-plan\nsoient entièrement chargées.\n5. La LED jaune du HDD à l'avant de la console\ndevrait cesser de clignoter.\n6. Une fois les icônes chargées et le HDD au repos,\nsélectionne Patch OpenSpy.\n7. Attends l'apparition de la notification de confirmation.\n8. Quitte le XMB et connecte-toi en ligne dans le jeu et sur le PSN.
TEXT_MENU_OPENSPY_HINT=Lance le jeu sans être connecté au PSN et attends que les icônes du XMB se chargent. Étapes complètes : Instructions > Patch OpenSpy.
