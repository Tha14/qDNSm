TEXT_HELP_TITLE=Comment utiliser qDNSm sans reconnexion automatique
TEXT_HELP_BODY=1. Choisissez un serveur DNS dans la liste.\n2. Accédez à Paramètres > Paramètres réseau.\n3. Sélectionnez « Connexion Internet » et appuyez sur X.\n4. Sélectionnez « Désactiver ».\n5. Sélectionnez à nouveau « Connexion Internet » et appuyez sur X.\n6. Sélectionnez « Activer ».\n7. Vous utilisez désormais le serveur DNS que vous avez choisi.
