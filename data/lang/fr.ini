TEXT_MENU_HIGH_MEMORY_TITLE=Avertissement d'utilisation élevée de la mémoire
TEXT_MENU_HIGH_MEMORY_DESCRIPTION=Un point d'exclamation jaune près de la flamme\nsignale une utilisation élevée de la mémoire VSH.\nCela peut se produire avec webMAN Mod Full\nou avec trop de plugins dans boot_plugins.txt.\n\nFixe : utilisation élevée de la mémoire VSH.\nClignotant : la mémoire VSH atteint un niveau dangereux.\n\nSi vous n'avez pas besoin des fonctionnalités supplémentaires\nde webMAN Mod, utilisez webMAN Mod Lite.\nSupprimez les plugins dont vous n'avez pas besoin.\nCeci est particulièrement recommandé si les jeux plantent\nou si la console revient au menu de récupération lors du lancement d'un jeu.
