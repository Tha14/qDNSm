TEXT_MENU_HIGH_MEMORY_TITLE=High Memory use warning
TEXT_MENU_HIGH_MEMORY_DESCRIPTION=A yellow exclamation mark by the flame warns of high VSH memory use.\nThis can happen with webMAN Mod Full or many boot_plugins.txt plugins.\n\nSteady means VSH memory is high.\nFlashing means VSH memory is at unsafe levels.\n\nIf you do not need webMAN Mod extras, use webMAN Mod Lite.\nRemove plugins you do not need.\nDo this if games crash or the console resets to recovery\nwhen starting a game.
